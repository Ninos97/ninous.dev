    Title: "Ninous.dev"
    Content: >
        Technical blog focused on Sentinel, Defender XDR, and detection logic.
  socialIcons:
    - name: email
      url: "mailto:ninous.saoumi@gmail.com"
    - name: linkedin
      url: "https://www.linkedin.com/in/ninous-s/"

